<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alma Research V2 - Play Store Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/80 backdrop-blur p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-amber-300 bg-clip-text text-transparent">
                    <i class="fa-solid fa-chart-line mr-2"></i>Play Store Market Intelligence V2
                </h1>
                <p class="text-xs text-slate-400 mt-1">Radar analisis pasar otomatis & tren unduhan bulanan</p>
            </div>
            
            <div class="flex gap-4 text-center">
                <div class="bg-slate-900/60 px-4 py-2 rounded-xl border border-slate-700/50">
                    <div class="text-xs text-slate-400">Total Aplikasi</div>
                    <div id="totalApps" class="text-lg font-bold text-amber-400">0</div>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700 space-y-3">
            <input type="text" id="searchInput" onkeyup="applyAllFilters()" placeholder="Cari nama aplikasi, package name, atau keyword..." 
                   class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500">

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <!-- Filter Kategori -->
                <div>
                    <label class="text-[11px] text-slate-400 font-semibold mb-1 block">KATEGORI</label>
                    <select id="categoryFilter" onchange="applyAllFilters()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200">
                        <option value="ALL">Semua Kategori</option>
                        <optgroup label="📱 APLIKASI">
                            <option value="BOOKS_AND_REFERENCE">Books & Reference</option>
                            <option value="EDUCATION">Education</option>
                            <option value="LIFESTYLE">Lifestyle</option>
                            <option value="TOOLS">Tools & Utility</option>
                            <option value="PRODUCTIVITY">Productivity</option>
                            <option value="BUSINESS">Business</option>
                            <option value="ENTERTAINMENT">Entertainment</option>
                        </optgroup>
                        <optgroup label="🎮 GAME">
                            <option value="GAME_TRIVIA">Game - Trivia</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Minimal Download -->
                <div>
                    <label class="text-[11px] text-slate-400 font-semibold mb-1 block">MINIMAL TOTAL DOWNLOAD</label>
                    <select id="downloadsFilter" onchange="applyAllFilters()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs">
                        <option value="0">Semua Total Download</option>
                        <option value="10000">10.000+ Downloads</option>
                        <option value="100000">100.000+ Downloads</option>
                        <option value="1000000">1.000.000+ Downloads</option>
                    </select>
                </div>

                <!-- Urutan / Sortir -->
                <div>
                    <label class="text-[11px] text-slate-400 font-semibold mb-1 block">URUTKAN BERDASARKAN</label>
                    <select id="sortFilter" onchange="applyAllFilters()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs">
                        <option value="RECENT_DESC">🔥 Recent Downloads (Bulan Ini)</option>
                        <option value="NEWEST">✨ Aplikasi Terbaru Rilis</option>
                        <option value="DOWNLOADS_DESC">📥 Total Download</option>
                        <option value="SCORE_DESC">⭐ Rating Highest</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Data Table Chart V2 -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/80 text-slate-400 text-xs uppercase border-b border-slate-700">
                            <th class="p-4">App Info & Category</th>
                            <th class="p-4">Recent Downloads (30 Hari)</th>
                            <th class="p-4">Total Downloads</th>
                            <th class="p-4">Release Date</th>
                            <th class="p-4">Rating</th>
                            <th class="p-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="researchTable" class="divide-y divide-slate-700/60 text-sm"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let appData = [];

        async function fetchDatabase() {
            try {
                const response = await fetch('database.json');
                appData = await response.json();
                applyAllFilters();
            } catch (e) {
                console.error("Gagal memuat database.json", e);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('researchTable');
            tbody.innerHTML = '';
            document.getElementById('totalApps').innerText = data.length;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Data belum tersedia atau tidak ada yang sesuai filter. Selesaikan jalankan aksi GitHub Scraper pertama Anda.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const row = `
                    <tr class="hover:bg-slate-700/40 transition-colors">
                        <td class="p-4">
                            <div class="font-semibold text-slate-100">${item.title}</div>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs text-slate-400 font-mono">${item.package}</span>
                                <span class="text-[10px] bg-slate-700 text-amber-300/90 px-2 py-0.5 rounded font-mono font-medium">${item.category}</span>
                            </div>
                        </td>
                        <td class="p-4">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                                <i class="fa-solid fa-fire text-[10px]"></i> +${item.recentDownloads.toLocaleString()} / bln
                            </span>
                        </td>
                        <td class="p-4">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                <i class="fa-solid fa-download text-[10px]"></i> ${item.installsText}
                            </span>
                        </td>
                        <td class="p-4 text-xs text-slate-300">${item.releaseDate}</td>
                        <td class="p-4 text-amber-400 font-bold"><i class="fa-solid fa-star text-xs"></i> ${item.score}</td>
                        <td class="p-4 text-center">
                            <a href="https://play.google.com/store/apps/details?id=${item.package}" target="_blank" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300 transition-colors" title="Lihat di Play Store">
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                            </a>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function applyAllFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const minDownloads = parseInt(document.getElementById('downloadsFilter').value, 10);
            const sortBy = document.getElementById('sortFilter').value;

            let filtered = appData.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(query) || item.package.toLowerCase().includes(query);
                const matchesCategory = (category === 'ALL') || (item.category === category);
                const matchesDownloads = item.rawInstalls >= minDownloads;
                return matchesSearch && matchesCategory && matchesDownloads;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'RECENT_DESC') return b.recentDownloads - a.recentDownloads;
                if (sortBy === 'NEWEST') return new Date(b.releaseDate) - new Date(a.releaseDate);
                if (sortBy === 'DOWNLOADS_DESC') return b.rawInstalls - a.rawInstalls;
                if (sortBy === 'SCORE_DESC') return b.score - a.score;
            });

            renderTable(filtered);
        }

        window.onload = fetchDatabase;
    </script>
</body>
</html>
