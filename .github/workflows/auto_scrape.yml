name: Auto Scrape Play Store Intelligence

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# Mengizinkan GitHub Actions menulis/menyimpan database.json kembali ke repo
permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google Play Scraper
        run: pip install google-play-scraper

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market research data" && git push)
